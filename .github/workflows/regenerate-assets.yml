name: Regenerate macOS icon and DMG assets

# Assets.car (the macOS 26 app icon) and dmg_dsstore (the DMG window layout)
# can only be built on macOS. This rebuilds them from their sources and
# commits the results to the branch that changed the sources.
on:
  push:
    branches: ['**']
    paths:
      - resources/assets/AppIcon.icon/**
      - resources/assets/app.icns
      - resources/dmg.json
      - resources/dmg_background.png
      - devutils/generate_dmg_dsstore.sh
      - .github/workflows/regenerate-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Use Xcode 26
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Install coreutils
        run: brew install coreutils

      - name: Check actool against Helium's original icon
        continue-on-error: true
        run: |
          git fetch --depth 1 origin main
          ref="$PWD/build/reference"
          mkdir -p "$ref/AppIcon.icon/Assets" "$ref/Empty.xcassets" "$ref/a" "$ref/b"
          git show FETCH_HEAD:resources/assets/AppIcon.icon/icon.json > "$ref/AppIcon.icon/icon.json"
          git show FETCH_HEAD:resources/assets/AppIcon.icon/Assets/logo.svg > "$ref/AppIcon.icon/Assets/logo.svg"
          echo '{"info":{"author":"xcode","version":1}}' > "$ref/Empty.xcassets/Contents.json"
          common=(--app-icon AppIcon --platform macosx --target-device mac
                  --minimum-deployment-target 12.0 --errors --warnings)
          echo "== .icon alone"
          xcrun actool --compile "$ref/a" --output-partial-info-plist "$ref/a/p.plist" \
            "${common[@]}" "$ref/AppIcon.icon" || echo "FAILED: .icon alone"
          echo "== .icon with an asset catalog"
          xcrun actool --compile "$ref/b" --output-partial-info-plist "$ref/b/p.plist" \
            "${common[@]}" "$ref/Empty.xcassets" "$ref/AppIcon.icon" || echo "FAILED: with catalog"
          ls -la "$ref/a" "$ref/b"

      - name: Compile Assets.car from AppIcon.icon
        run: |
          # actool hands off to a helper that doesn't share our working
          # directory, so every path must be absolute
          out="$PWD/build/icon"
          mkdir -p "$out"
          xcrun actool \
            --compile "$out" \
            --app-icon AppIcon \
            --platform macosx \
            --target-device mac \
            --minimum-deployment-target 12.0 \
            --output-partial-info-plist "$out/partial.plist" \
            --errors --warnings --notices \
            "$PWD/resources/assets/AppIcon.icon"
          xcrun assetutil --info "$out/Assets.car" | grep -q '"AppIcon"'
          cp "$out/Assets.car" resources/assets/Assets.car

      - name: Regenerate dmg_dsstore
        run: ./devutils/generate_dmg_dsstore.sh

      - name: Commit regenerated assets
        run: |
          git add resources/assets/Assets.car resources/dmg_dsstore
          if git diff --cached --quiet; then
            echo "Assets are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Assets.car and dmg_dsstore"
          git push origin "HEAD:${GITHUB_REF_NAME}"
