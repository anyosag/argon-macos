name: Regenerate macOS icon and DMG assets

# Assets.car (the macOS 26 app icon) and dmg_dsstore (the DMG window layout)
# can only be built on macOS. This rebuilds them from their sources and
# commits the results to the branch that changed the sources.
on:
  push:
    branches: ['**']
    paths:
      - resources/assets/AppIcon.icon/**
      - resources/assets/Assets.xcassets/**
      - resources/assets/app.icns
      - resources/dmg.json
      - resources/dmg_background.png
      - devutils/generate_dmg_dsstore.sh
      - .github/workflows/regenerate-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Xcode 26
        # actool reads .icon packages through Icon Composer's document type,
        # which a fresh runner hasn't registered ("Could not open
        # AppIcon.icon"): finish Xcode's first launch and register the
        # Icon Composer app it ships with.
        run: |
          xcode=/Applications/Xcode_26.5.app
          [ -d "$xcode" ] || xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
          xcrun actool --version
          sudo xcodebuild -runFirstLaunch
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          find "$xcode/Contents/Applications" -maxdepth 1 -name 'Icon Composer.app' -print \
            -exec "$lsregister" -f {} \;

      - name: Install coreutils
        run: brew install coreutils

      - name: Compile Assets.car from AppIcon.icon
        shell: bash
        # Flags as in Chromium's tools/mac/icons/compile_car.py. Without
        # --lightweight-asset-runtime-mode, actool uses the runner's system
        # asset frameworks, which can't open .icon packages ("Could not
        # open AppIcon.icon"). The .xcassets holds the fallback bitmaps for
        # macOS before 26.
        run: |
          out="$PWD/build/icon"
          src="$PWD/build/icon-src"
          mkdir -p "$out" "$src"
          cp -R resources/assets/Assets.xcassets resources/assets/AppIcon.icon "$src/"
          xcrun actool \
            --output-format=xml1 --notices --warnings --errors \
            --platform=macosx --target-device=mac \
            --lightweight-asset-runtime-mode=enabled \
            --enable-icon-stack-fallback-generation=disabled \
            --include-all-app-icons \
            --app-icon=AppIcon \
            --minimum-deployment-target=13.0 \
            --output-partial-info-plist="$out/partial.plist" \
            --compile="$out" \
            "$src/Assets.xcassets" "$src/AppIcon.icon"
          xcrun assetutil --info "$out/Assets.car" | grep -q '"AppIcon"'
          cp "$out/Assets.car" resources/assets/Assets.car

      - name: Regenerate dmg_dsstore
        run: ./devutils/generate_dmg_dsstore.sh

      - name: Commit regenerated assets
        run: |
          git add resources/assets/Assets.car resources/dmg_dsstore
          if git diff --cached --quiet; then
            echo "Assets are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Assets.car and dmg_dsstore"
          git push origin "HEAD:${GITHUB_REF_NAME}"
