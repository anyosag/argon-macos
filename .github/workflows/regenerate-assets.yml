name: Regenerate DMG layout

# dmg_dsstore (the DMG window layout) can only be built on macOS. This
# rebuilds it from its sources and commits it to the branch that changed
# them. Assets.car can't be built here (actool on GitHub's runners fails to
# read any .icon package): run devutils/compile_assets_car.sh on a Mac.
on:
  push:
    branches: ['**']
    paths:
      - resources/assets/app.icns
      - resources/dmg.json
      - resources/dmg_background.png
      - devutils/generate_dmg_dsstore.sh
      - .github/workflows/regenerate-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # dmg_dsstore differs byte-for-byte on every build, so rebuilding it when
  # nothing it depends on changed (a merge, a force push) only adds a commit.
  # Rebuild it only if its sources changed since it was last committed.
  check:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    env:
      SOURCES: >-
        resources/assets/app.icns resources/dmg.json
        resources/dmg_background.png devutils/generate_dmg_dsstore.sh
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare dmg_dsstore with its sources
        id: check
        run: |
          last=$(git log -1 --format=%H -- resources/dmg_dsstore)
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$last" ] &&
             git diff --quiet "$last" HEAD -- $SOURCES; then
            echo "dmg_dsstore is newer than its sources (last built in $last)"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  regenerate:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install coreutils
        run: brew install coreutils

      - name: Regenerate dmg_dsstore
        run: ./devutils/generate_dmg_dsstore.sh

      - name: Commit dmg_dsstore
        run: |
          git add resources/dmg_dsstore
          if git diff --cached --quiet; then
            echo "dmg_dsstore is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate dmg_dsstore"
          git push origin "HEAD:${GITHUB_REF_NAME}"
